<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bit: quiz-cards</title>
<!-- category: interactive | source: cool_1 -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0e14;
  color: #f0ebe1;
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  gap: 24px;
}

/* === QUIZ CARDS ===
   Multiple-choice cards with animated correct/incorrect feedback.
   Correct answer: mint pulse that settles to a tinted background.
   Wrong answer: coral pulse on the chosen option + quiet reveal of the correct one.
   Score tracker above. Swap quizData array to reuse with any question set. */

.progress-bar {
  width: 100%;
  max-width: 700px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 24px;
  background: #1a1d28;
  border: 1px solid rgba(240,235,225,0.08);
  border-radius: 14px;
}
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: #6b6d7a;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.stat .val {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 600;
}
.stat .tot { color: #6b6d7a; font-size: 14px; }

.quiz-grid {
  width: 100%;
  max-width: 700px;
  display: grid;
  gap: 20px;
}

.quiz-card {
  background: #1a1d28;
  border: 1px solid rgba(240,235,225,0.08);
  border-radius: 20px;
  padding: 28px;
  position: relative;
  overflow: hidden;
}
.q-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #d4ff3a;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.q-text {
  font-family: 'Fraunces', serif;
  font-size: 21px;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 20px;
}
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.opt {
  background: #21242f;
  border: 1px solid rgba(240,235,225,0.18);
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: #f0ebe1;
  text-align: left;
  font-family: 'Space Grotesk', sans-serif;
}
.opt:hover:not(.answered) {
  border-color: #d4ff3a;
  background: #15171f;
  transform: translateX(4px);
}
.opt .letter {
  width: 26px; height: 26px;
  border-radius: 6px;
  background: #0d0e14;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: #d4ff3a;
  flex-shrink: 0;
}
.opt.answered { cursor: default; }

@keyframes correctPulse {
  0%   { background:#21242f; border-color:rgba(240,235,225,0.18); transform:scale(1);    box-shadow:0 0 0 rgba(77,212,172,0); }
  20%  { background:#4dd4ac; border-color:#4dd4ac;                transform:scale(1.03); box-shadow:0 0 50px rgba(77,212,172,0.6); }
  60%  { background:#4dd4ac; border-color:#4dd4ac; }
  100% { background:rgba(77,212,172,0.18); border-color:#4dd4ac;  transform:scale(1);    box-shadow:0 0 0 rgba(77,212,172,0); }
}
@keyframes incorrectPulse {
  0%   { background:#21242f; border-color:rgba(240,235,225,0.18); transform:scale(1);    box-shadow:0 0 0 rgba(255,94,98,0); }
  20%  { background:#ff5e62; border-color:#ff5e62;                transform:scale(0.98); box-shadow:0 0 50px rgba(255,94,98,0.6); }
  60%  { background:#ff5e62; border-color:#ff5e62; }
  100% { background:rgba(255,94,98,0.18); border-color:#ff5e62;   transform:scale(1);    box-shadow:0 0 0 rgba(255,94,98,0); }
}
@keyframes revealCorrect {
  0%   { background:#21242f; border-color:rgba(240,235,225,0.18); }
  100% { background:rgba(77,212,172,0.18); border-color:#4dd4ac; }
}

.opt.correct         { animation: correctPulse   1.4s forwards; }
.opt.correct .letter { color: #4dd4ac; }
.opt.incorrect         { animation: incorrectPulse 1.4s forwards; }
.opt.incorrect .letter { color: #ff5e62; }
.opt.reveal-correct         { animation: revealCorrect  0.6s forwards; }
.opt.reveal-correct .letter { color: #4dd4ac; }

.feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  border: 1px solid;
  animation: fadeIn 0.4s;
}
.feedback.show         { display: block; }
.feedback.correct      { background:rgba(77,212,172,0.08); border-color:rgba(77,212,172,0.3); color:#4dd4ac; }
.feedback.incorrect    { background:rgba(255,94,98,0.08);  border-color:rgba(255,94,98,0.3);  color:#ff5e62; }
@keyframes fadeIn {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}

@media (max-width: 480px) { .options { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="progress-bar">
  <div class="stat">
    <span class="lbl">completed</span>
    <span class="val"><span id="done">0</span><span class="tot">/5</span></span>
  </div>
  <div class="stat" style="text-align:center">
    <span class="lbl">correct</span>
    <span class="val" style="color:#4dd4ac"><span id="right">0</span></span>
  </div>
  <div class="stat" style="text-align:right">
    <span class="lbl">accuracy</span>
    <span class="val"><span id="acc">—</span></span>
  </div>
</div>

<div class="quiz-grid" id="quizGrid"></div>

<script>
const questions = [
  {
    q: "A triangle has angles of 47°, 53°, and 80°. What kind is it?",
    opts: ["Right triangle","Acute scalene","Obtuse isosceles","Equilateral"],
    ans: 1,
    fb: "All three angles are under 90° (acute), and all three differ (scalene)."
  },
  {
    q: "For f(x) = ax³ + bx² + cx + d, what does constant d represent?",
    opts: ["The slope at x = 0","The y-intercept","A root of the function","The discriminant"],
    ans: 1,
    fb: "f(0) = d, so the point (0, d) is where the curve meets the y-axis."
  },
  {
    q: "What does b² − 4ac < 0 tell you about a quadratic?",
    opts: ["Two real roots","One repeated root","Two complex roots","No solutions"],
    ans: 2,
    fb: "Negative discriminant → parabola never crosses the x-axis → complex conjugate roots."
  },
  {
    q: "If a triangle has sides 3, 4, and 5, what is its area?",
    opts: ["6","7.5","10","12"],
    ans: 0,
    fb: "3-4-5 is a right triangle, so area = ½ × 3 × 4 = 6."
  },
  {
    q: "What is the derivative of f(x) = x³ ?",
    opts: ["x²","3x","3x²","x⁴/4"],
    ans: 2,
    fb: "Power rule: d/dx[xⁿ] = n·xⁿ⁻¹, so d/dx[x³] = 3x²."
  }
];

const grid = document.getElementById('quizGrid');
const answered = new Array(questions.length).fill(false);
let correct = 0;

questions.forEach((item, qi) => {
  const card = document.createElement('div');
  card.className = 'quiz-card';
  card.innerHTML = `
    <div class="q-num">QUESTION ${String(qi+1).padStart(2,'0')}</div>
    <div class="q-text">${item.q}</div>
    <div class="options">
      ${item.opts.map((opt,i) => `
        <button class="opt" data-q="${qi}" data-i="${i}">
          <span class="letter">${String.fromCharCode(65+i)}</span>
          <span>${opt}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback"></div>
  `;
  grid.appendChild(card);
});

grid.addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn) return;
  const qi = +btn.dataset.q, oi = +btn.dataset.i;
  if (answered[qi]) return;
  answered[qi] = true;

  const card   = btn.closest('.quiz-card');
  const allOpt = card.querySelectorAll('.opt');
  const fb     = card.querySelector('.feedback');

  allOpt.forEach(o => o.classList.add('answered'));

  if (oi === questions[qi].ans) {
    btn.classList.add('correct');
    correct++;
    fb.className = 'feedback show correct';
    fb.innerHTML = `<strong>Correct.</strong> ${questions[qi].fb}`;
  } else {
    btn.classList.add('incorrect');
    allOpt[questions[qi].ans].classList.add('reveal-correct');
    fb.className = 'feedback show incorrect';
    fb.innerHTML = `<strong>Not quite.</strong> ${questions[qi].fb}`;
  }

  const done = answered.filter(Boolean).length;
  document.getElementById('done').textContent  = done;
  document.getElementById('right').textContent = correct;
  document.getElementById('acc').textContent   = done > 0 ? Math.round(correct/done*100)+'%' : '—';
});
</script>
</body>
</html>
