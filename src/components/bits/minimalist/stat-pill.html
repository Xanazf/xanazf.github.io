<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bit: stat-pill</title>
<!-- category: components | source: minimalist_2 -->
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0c0b09;
  color: #f0ead6;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 13px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 40px;
}

/* === STAT PILL ===
   Capsule-shaped badge with a live pulse dot and stat value.
   On hover: accent border, glow ring, slight lift.
   The .flash-up class triggers a one-shot jump animation
   (useful for simulating live counter increments). */

.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: #14120e;
  border: 1px solid rgba(240,234,214,0.18);
  border-radius: 999px;
  font-size: 12px;
  text-decoration: none;
  color: #f0ead6;
  cursor: default;
  transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
}
.stat-pill:hover {
  border-color: #f59e0b;
  box-shadow: 0 0 0 3px rgba(245,158,11,0.12);
  transform: translateY(-1px);
}

/* Pulsing live indicator dot */
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #06b6d4;
  box-shadow: 0 0 8px #06b6d4;
  animation: live-pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes live-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.3; }
}

.stat-sep { color: rgba(240,234,214,0.25); }
.stat-icon { font-size: 11px; color: #f59e0b; }
.stat-icon-2 { font-size: 11px; color: #06b6d4; }

/* Flash-up animation: number jumps when a new count arrives */
.flash-up { animation: flash-up-anim 0.7s ease; }
@keyframes flash-up-anim {
  0%   { transform: translateY(0); }
  40%  { transform: translateY(-5px); color: #06b6d4; text-shadow: 0 0 12px #06b6d4; }
  100% { transform: translateY(0); }
}

/* demo counter */
.counter { display: inline-block; }
</style>
</head>
<body>

<!-- Basic stat pill -->
<div class="stat-pill">
  <span class="live-dot"></span>
  <span>currently live</span>
</div>

<!-- Stars + forks (GitHub style) -->
<div class="stat-pill" id="ghPill">
  <span class="live-dot"></span>
  <span class="stat-icon">★</span>
  <span id="starCount" class="counter">82.4k</span>
  <span class="stat-sep">·</span>
  <span class="stat-icon-2">⑂</span>
  <span>4.2k</span>
</div>

<!-- Simpler: just a number -->
<div class="stat-pill">
  <span class="live-dot"></span>
  <span>142 essays</span>
</div>

<script>
// Simulate live counter increments with flash-up animation
const starCount = document.getElementById('starCount');
let count = 82400;

function formatNum(n) {
  return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
}

setInterval(() => {
  if (Math.random() < 0.4) {
    count++;
    starCount.textContent = formatNum(count);
    starCount.classList.remove('flash-up');
    void starCount.offsetWidth; // restart animation
    starCount.classList.add('flash-up');
  }
}, 6000);
</script>
</body>
</html>
